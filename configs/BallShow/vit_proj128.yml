# Ablation: Aggressive compression (128-dim per branch = 640-dim total)
# Inherits from vit_all_optimizations.yml but with PROJ_DIM=128
MODEL:
  PRETRAIN_CHOICE: 'imagenet'
  PRETRAIN_PATH: './jx_vit_base_p16_224-80ecf9dd.pth'
  METRIC_LOSS_TYPE: 'circle'
  IF_LABELSMOOTH: 'on'
  IF_WITH_CENTER: 'no'
  NAME: 'transformer'
  NO_MARGIN: True
  DEVICE_ID: ('0')
  TRANSFORMER_TYPE: 'vit_base_patch16_224_TransReID'
  STRIDE_SIZE: [12, 12]
  SIE_CAMERA: True
  SIE_COE: 3.0
  JPM: True
  RE_ARRANGE: True
  ID_LOSS_TYPE: 'arcface'
  ID_LOSS_WEIGHT: 1.0
  TRIPLET_LOSS_WEIGHT: 1.0
  PROJ_DIM: 0                      # Disabled: no compression (full 3840-dim)
  PATCH_DROP_PROB: 0.2
  MIXSTYLE_P: 0.3
  MIXSTYLE_ALPHA: 0.1

INPUT:
  SIZE_TRAIN: [384, 128]
  SIZE_TEST: [384, 128]
  PROB: 0.5; RE_PROB: 0.5; CJ_PROB: 0.2; MB_PROB: 0.2; PADDING: 10
  PIXEL_MEAN: [0.5, 0.5, 0.5]; PIXEL_STD: [0.5, 0.5, 0.5]

DATASETS:
  NAMES: ('ballshow'); ROOT_DIR: ('./data/BallShow')

DATALOADER:
  SAMPLER: 'softmax_triplet'; NUM_INSTANCE: 4; NUM_WORKERS: 8

SOLVER:
  OPTIMIZER_NAME: 'AdamW'; ADAM_BETAS: (0.9, 0.999)
  MAX_EPOCHS: 180; BASE_LR: 0.00035; IMS_PER_BATCH: 64
  WARMUP_METHOD: 'linear'; WARMUP_EPOCHS: 5
  CHECKPOINT_PERIOD: 20; LOG_PERIOD: 50; EVAL_PERIOD: 10; EVAL_BEST: True
  WEIGHT_DECAY: 0.05; WEIGHT_DECAY_BIAS: 0.0; BIAS_LR_FACTOR: 1.0
  COSINE_SCALE: 30; COSINE_MARGIN: 0.5
  CIRCLE_S: 128.0; CIRCLE_M: 0.25
  GRAD_CLIP: 1.0; TB_LOG: True; SEED: 1234

TEST:
  EVAL: True; IMS_PER_BATCH: 256
  RE_RANKING: True; RERANK_K1: 20; RERANK_K2: 6; RERANK_LAMBDA: 0.3
  MULTI_SCALE: True; SCALES: ([256, 128], [384, 128])
  QE: True; QE_K: 10
  WEIGHT: ''; NECK_FEAT: 'after'; FEAT_NORM: 'yes'

OUTPUT_DIR: 'logs/BallShow_proj128'
