MODEL:
  PRETRAIN_CHOICE: 'imagenet'
  PRETRAIN_PATH: '/root/autodl-tmp/transformer_120.pth'  # 预训练权重（使用已有checkpoint的backbone权重初始化）
  METRIC_LOSS_TYPE: 'triplet'
  IF_LABELSMOOTH: 'on'
  IF_WITH_CENTER: 'yes'
  NAME: 'transformer'
  NO_MARGIN: False               # 使用硬边界三元组损失（更难的负样本挖掘）
  DEVICE_ID: ('0')
  TRANSFORMER_TYPE: 'vit_base_patch16_224_TransReID'
  STRIDE_SIZE: [12, 12]          # 重叠 patch，保留更多细粒度细节
  SIE_CAMERA: True               # 侧信息嵌入（相机）
  SIE_VIEW: False                # 不启用视角嵌入（篮球场景中视角信息有限）
  SIE_COE: 3.0
  JPM: True                      # Jigsaw Patch Module：部位级特征学习
  RE_ARRANGE: True
  SHUFFLE_GROUP: 4               # 增加 shuffle 组数，更丰富的部位组合
  SHIFT_NUM: 7                   # 增加 shift 数量
  DEVIDE_LENGTH: 4
  # ArcFace 损失函数配置（细粒度判别关键！）
  ID_LOSS_TYPE: 'arcface'
  COS_LAYER: True
  DROP_PATH: 0.2                 # 适度提高 drop path（正则化）
  DROP_OUT: 0.1
  ATT_DROP_RATE: 0.1

INPUT:
  SIZE_TRAIN: [384, 128]         # 更高分辨率 → 更好地识别球衣号码
  SIZE_TEST: [384, 128]
  PROB: 0.5                      # 随机水平翻转
  RE_PROB: 0.7                   # 随机擦除（模拟严重遮挡）
  CJ_PROB: 0.4                   # 颜色抖动（适应室内/室外光照变化）
  MB_PROB: 0.35                  # 运动模糊（篮球场景中常见）
  PADDING: 10
  PIXEL_MEAN: [0.5, 0.5, 0.5]
  PIXEL_STD: [0.5, 0.5, 0.5]

DATASETS:
  NAMES: ('ballshow')
  ROOT_DIR: ('./data/BallShow')  # 请修改为自己的数据路径

DATALOADER:
  SAMPLER: 'softmax_triplet'
  NUM_INSTANCE: 4                # 每个 ID 采样 4 张图片
  NUM_WORKERS: 8

SOLVER:
  OPTIMIZER_NAME: 'SGD'
  MAX_EPOCHS: 200                # 更长训练
  BASE_LR: 0.008
  IMS_PER_BATCH: 64
  WARMUP_METHOD: 'linear'
  WARMUP_EPOCHS: 10              # 更长的 warmup
  LARGE_FC_LR: False
  CHECKPOINT_PERIOD: 10          # 每10轮保存一次模型
  LOG_PERIOD: 50
  EVAL_PERIOD: 10                # 每10轮输出一次指标
  WEIGHT_DECAY: 1e-4
  WEIGHT_DECAY_BIAS: 1e-4
  BIAS_LR_FACTOR: 2
  MARGIN: 0.3                    # 三元组损失硬边界
  CENTER_LR: 0.5
  CENTER_LOSS_WEIGHT: 0.0005
  COSINE_MARGIN: 0.5             # ArcFace margin
  COSINE_SCALE: 30               # ArcFace scale
  STEPS: (80, 140, 180)          # 学习率衰减点
  GAMMA: 0.1
  SEED: 1234

TEST:
  EVAL: True
  IMS_PER_BATCH: 256
  RE_RANKING: True               # 测试时启用重排序
  WEIGHT: ''
  NECK_FEAT: 'after'             # 使用 BNNeck 之后的特征
  FEAT_NORM: 'yes'

OUTPUT_DIR: 'logs/BallShow_vit_transreid_optimized'
